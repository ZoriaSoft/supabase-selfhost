<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" role="img">
  <title>supabase-selfhost — how it works</title>
  <desc>Two paths: a single GoTrue binary plus Postgres for auth only, or setup.sh generating secrets and bringing up the full eleven-service stack behind the Envoy gateway, then verified by verify.sh.</desc>
  <style>
    .t1 { font: 600 26px ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Helvetica Neue", sans-serif; fill: #e6edf3; }
    .t2 { font: 400 15px ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Helvetica Neue", sans-serif; fill: #9aa7b4; }
    .hd { font: 600 15px ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Helvetica Neue", sans-serif; fill: #e6edf3; letter-spacing: 1px; }
    .ct { font: 600 15px ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Helvetica Neue", sans-serif; fill: #e6edf3; }
    .cd { font: 400 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Helvetica Neue", sans-serif; fill: #9aa7b4; }
    .mono { font: 500 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #3ecf8e; }
    .chip { font: 400 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Helvetica Neue", sans-serif; fill: #9aa7b4; }
    .card { fill: #161b22; stroke: #232a33; }
    .wire { stroke: #3a4450; stroke-width: 2; fill: none; }
    .flow { stroke: #3ecf8e; stroke-width: 2; fill: none; stroke-dasharray: 3 9; animation: dashmove 1.8s linear infinite; }
    @keyframes dashmove { to { stroke-dashoffset: -24; } }
    .stage { opacity: 0; animation: reveal .5s cubic-bezier(0.2, 0, 0, 1) both; }
    @keyframes reveal { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .sa { animation-delay: .05s; } .sb { animation-delay: .15s; } .sc { animation-delay: .25s; }
    .sd { animation-delay: .35s; } .se { animation-delay: .45s; }
    /* typewriter: cover slides right in steps, revealing the command */
    .typeCover { animation: typing 1.4s steps(10) .8s both; }
    @keyframes typing { from { transform: translateX(0); } to { transform: translateX(210px); } }
    /* service status dots turn green in stagger */
    .dot { fill: #5b6672; animation: doton .4s ease both; }
    @keyframes doton { to { fill: #3fb950; } }
    .d1 { animation-delay: .55s; } .d2 { animation-delay: .6s; } .d3 { animation-delay: .65s; }
    .d4 { animation-delay: .7s; } .d5 { animation-delay: .75s; } .d6 { animation-delay: .8s; }
    .d7 { animation-delay: .85s; } .d8 { animation-delay: .9s; } .d9 { animation-delay: .95s; }
    .d10 { animation-delay: 1s; } .d11 { animation-delay: 1.05s; }
    .verify { opacity: 0; animation: reveal .5s cubic-bezier(0.2, 0, 0, 1) 1.2s both; }
    /* data token: Envoy -> a service -> back, 9s loop */
    .tok { opacity: 0; animation: tok 9s cubic-bezier(0.2, 0, 0, 1) 3.2s infinite; }
    @keyframes tok {
      0%   { transform: translate(600px, 348px); opacity: 0; }
      6%   { opacity: 1; }
      22%  { transform: translate(600px, 430px); }
      38%  { transform: translate(1010px, 430px); }
      46%  { transform: translate(1080px, 478px); }
      60%  { transform: translate(1080px, 478px); }
      74%  { transform: translate(1080px, 478px); }
      88%  { transform: translate(466px, 292px); }
      96%  { transform: translate(466px, 292px); opacity: 1; }
      100% { transform: translate(466px, 292px); opacity: 0; }
    }
    .tok2 { opacity: 0; animation: tok2 9s cubic-bezier(0.2, 0, 0, 1) 3.2s infinite; }
    @keyframes tok2 {
      0%   { transform: translate(600px, 348px); opacity: 0; }
      6%   { opacity: 1; }
      22%  { transform: translate(600px, 430px); }
      38%  { transform: translate(600px, 480px); }
      58%  { transform: translate(600px, 480px); }
      74%  { transform: translate(600px, 430px); }
      88%  { transform: translate(466px, 292px); }
      96%  { transform: translate(466px, 292px); opacity: 1; }
      100% { transform: translate(466px, 292px); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <rect x="8" y="8" width="1184" height="644" rx="20" fill="#0e1116" stroke="#232a33"/>

  <text class="t1" x="48" y="56">supabase-selfhost</text>
  <text class="t2" x="48" y="82">Your own Supabase. One command.</text>

  <line x1="404" y1="110" x2="404" y2="630" stroke="#232a33"/>

  <!-- ===== Path A (left column) ===== -->
  <g class="stage sa">
    <text class="hd" x="48" y="136">PATH A — AUTH ONLY</text>
    <rect class="card" x="48" y="152" width="330" height="46" rx="8"/>
    <text class="mono" x="66" y="181">$ ./scripts/setup-gotrue.sh</text>
    <path class="wire" d="M 213 198 L 213 226"/>
    <path class="flow" d="M 213 198 L 213 226"/>
  </g>
  <g class="stage sb">
    <rect class="card" x="48" y="226" width="330" height="76" rx="10"/>
    <text class="ct" x="213" y="260" text-anchor="middle">GoTrue</text>
    <text class="cd" x="213" y="282" text-anchor="middle">single binary · all of Auth</text>
    <path class="wire" d="M 213 302 L 213 330"/>
    <path class="flow" d="M 213 302 L 213 330"/>
  </g>
  <g class="stage sc">
    <rect class="card" x="48" y="330" width="330" height="76" rx="10"/>
    <text class="ct" x="213" y="364" text-anchor="middle">Postgres</text>
    <text class="cd" x="213" y="386" text-anchor="middle">existing DB is fine</text>
    <rect x="48" y="430" width="120" height="32" rx="16" fill="#1c232c" stroke="#232a33"/>
    <text class="chip" x="108" y="451" text-anchor="middle">No Docker</text>
    <rect x="178" y="430" width="200" height="32" rx="16" fill="#1c232c" stroke="#232a33"/>
    <text class="chip" x="278" y="451" text-anchor="middle">Runs in sandboxes</text>
    <text class="cd" x="48" y="512" fill="#5b6672">signup · signin · JWT · refresh · MFA</text>
  </g>

  <!-- ===== Path B (right column) ===== -->
  <g class="stage sb">
    <text class="hd" x="440" y="136">PATH B — FULL STACK</text>
    <!-- terminal card -->
    <rect x="440" y="152" width="712" height="46" rx="8" fill="#0b0e12" stroke="#232a33"/>
    <circle cx="460" cy="175" r="5" fill="#f85149"/>
    <circle cx="478" cy="175" r="5" fill="#f0a03c"/>
    <circle cx="496" cy="175" r="5" fill="#3fb950"/>
    <text class="mono" x="516" y="181">$ ./setup.sh</text>
    <rect class="typeCover" x="516" y="162" width="220" height="26" fill="#0b0e12"/>
  </g>
  <g class="stage sc">
    <rect x="440" y="214" width="148" height="34" rx="17" fill="#1c232c" stroke="#232a33"/>
    <text class="chip" x="514" y="236" text-anchor="middle">checks Docker</text>
    <text class="cd" x="596" y="236">→</text>
    <rect x="612" y="214" width="196" height="34" rx="17" fill="#1c232c" stroke="#232a33"/>
    <text class="chip" x="710" y="236" text-anchor="middle">generates all secrets</text>
    <text class="cd" x="816" y="236">→</text>
    <rect x="832" y="214" width="200" height="34" rx="17" fill="#1c232c" stroke="#232a33"/>
    <text class="chip" x="932" y="236" text-anchor="middle">docker compose up -d</text>
  </g>

  <!-- services: Envoy gateway (wide) + 10-tile grid -->
  <g class="stage sd">
    <rect x="440" y="266" width="712" height="52" rx="10" fill="#1c232c" stroke="#3ecf8e" stroke-opacity="0.5"/>
    <circle class="dot d11" cx="466" cy="292" r="5"/>
    <text class="ct" x="486" y="298">Envoy gateway</text>
    <text class="cd" x="1136" y="298" text-anchor="end">:8000 · public entry</text>
    <path class="wire" d="M 600 318 L 600 430"/>
    <path class="flow" d="M 600 318 L 600 430"/>
  </g>
  <g class="stage se">
    <!-- row 1 -->
    <g><rect class="card" x="440" y="352" width="128" height="52" rx="9"/><circle class="dot d1" cx="456" cy="370" r="5"/><text class="cd" x="470" y="374" fill="#e6edf3">Postgres 17</text><text class="cd" x="470" y="392" fill="#5b6672">database</text></g>
    <g><rect class="card" x="582" y="352" width="128" height="52" rx="9"/><circle class="dot d2" cx="598" cy="370" r="5"/><text class="cd" x="612" y="374" fill="#e6edf3">GoTrue (Auth)</text><text class="cd" x="612" y="392" fill="#5b6672">auth</text></g>
    <g><rect class="card" x="724" y="352" width="128" height="52" rx="9"/><circle class="dot d3" cx="740" cy="370" r="5"/><text class="cd" x="754" y="374" fill="#e6edf3">PostgREST</text><text class="cd" x="754" y="392" fill="#5b6672">rest api</text></g>
    <g><rect class="card" x="866" y="352" width="128" height="52" rx="9"/><circle class="dot d4" cx="882" cy="370" r="5"/><text class="cd" x="896" y="374" fill="#e6edf3">Realtime</text><text class="cd" x="896" y="392" fill="#5b6672">websockets</text></g>
    <g><rect class="card" x="1008" y="352" width="144" height="52" rx="9"/><circle class="dot d5" cx="1024" cy="370" r="5"/><text class="cd" x="1038" y="374" fill="#e6edf3">Storage</text><text class="cd" x="1038" y="392" fill="#5b6672">files · s3</text></g>
    <!-- row 2 -->
    <g><rect class="card" x="440" y="418" width="128" height="52" rx="9"/><circle class="dot d6" cx="456" cy="436" r="5"/><text class="cd" x="470" y="440" fill="#e6edf3">Edge Functions</text><text class="cd" x="470" y="458" fill="#5b6672">serverless</text></g>
    <g><rect class="card" x="582" y="418" width="128" height="52" rx="9"/><circle class="dot d7" cx="598" cy="436" r="5"/><text class="cd" x="612" y="440" fill="#e6edf3">Studio</text><text class="cd" x="612" y="458" fill="#5b6672">dashboard</text></g>
    <g><rect class="card" x="724" y="418" width="128" height="52" rx="9"/><circle class="dot d8" cx="740" cy="436" r="5"/><text class="cd" x="754" y="440" fill="#e6edf3">Supavisor</text><text class="cd" x="754" y="458" fill="#5b6672">pooler</text></g>
    <g><rect class="card" x="866" y="418" width="128" height="52" rx="9"/><circle class="dot d9" cx="882" cy="436" r="5"/><text class="cd" x="896" y="440" fill="#e6edf3">Meta</text><text class="cd" x="896" y="458" fill="#5b6672">pg-meta</text></g>
    <g><rect class="card" x="1008" y="418" width="144" height="52" rx="9"/><circle class="dot d10" cx="1024" cy="436" r="5"/><text class="cd" x="1038" y="440" fill="#e6edf3">ImgProxy</text><text class="cd" x="1038" y="458" fill="#5b6672">images</text></g>
  </g>

  <!-- verify bar -->
  <g class="verify">
    <rect x="440" y="500" width="712" height="88" rx="12" fill="#161b22" stroke="#232a33"/>
    <text class="ct" x="468" y="532">verify.sh</text>
    <text class="cd" x="1136" y="532" text-anchor="end"><tspan fill="#3fb950" font-weight="600">5/5</tspan> passed</text>
    <g font-size="12" fill="#9aa7b4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', sans-serif">
      <circle cx="474" cy="560" r="3" fill="#3fb950"/><text x="484" y="565" class="cd">healthchecks</text>
      <circle cx="600" cy="560" r="3" fill="#3fb950"/><text x="610" y="565" class="cd">Studio</text>
      <circle cx="690" cy="560" r="3" fill="#3fb950"/><text x="700" y="565" class="cd">signup → JWT</text>
      <circle cx="830" cy="560" r="3" fill="#3fb950"/><text x="840" y="565" class="cd">REST CRUD</text>
      <circle cx="950" cy="560" r="3" fill="#3fb950"/><text x="960" y="565" class="cd">Storage upload</text>
    </g>
  </g>

  <!-- data tokens -->
  <circle class="tok" r="6" fill="#3ecf8e"/>
  <circle class="tok2" r="5" fill="#3ecf8e" fill-opacity="0.7"/>
</svg>
